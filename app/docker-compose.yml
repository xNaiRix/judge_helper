# Локальный запуск приложения в Docker.
#   docker compose up --build
#   open http://127.0.0.1:8000/
name: judge-helper

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: judge-helper:local
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      # В продакшене обязательно задайте свой секрет!
      APP_SECRET_KEY: ${APP_SECRET_KEY:-dev-secret-change-me}
      # 1 — демо-режим: токены подтверждения email возвращаются в API.
      ECHO_EMAIL_TOKENS: ${ECHO_EMAIL_TOKENS:-1}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-100}
      DATABASE_URL: sqlite:////data/judge_helper.db
    volumes:
      - judge_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  judge_data:
