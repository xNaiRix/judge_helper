name: CI/CD

# Запуск: любой push, PR, теги v* и ручной запуск.
# Образ собирается после успешных lint/тестов/smoke и публикуется в GHCR.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  lint:
    name: Линтер (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Установка зависимостей
        run: pip install -r requirements-dev.txt

      - name: Проверка стиля (ruff check)
        run: ruff check src tests scripts

      - name: Проверка форматирования (ruff format)
        run: ruff format --check src tests scripts

  # ---------------------------------------------------------------------------
  test:
    name: Тесты (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: app
    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: Установка Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Шрифты с кириллицей (для PDF-протокола)
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Установка зависимостей
        run: pip install -r requirements-dev.txt

      - name: Тесты с покрытием (порог 80%)
        run: >
          pytest --cov=judge_helper --cov-report=xml --cov-report=term-missing
          --cov-fail-under=80 --junitxml=report.xml

      - name: Публикация отчётов (coverage + junit)
        uses: actions/upload-artifact@v4
        if: always() && matrix.python-version == '3.11'
        with:
          name: test-reports
          path: |
            app/coverage.xml
            app/report.xml
          retention-days: 14

  # ---------------------------------------------------------------------------
  smoke:
    name: Smoke-проверка приложения
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Smoke-проверка (/health и веб-интерфейс)
        run: |
          python -c "
          import sys; sys.path.insert(0, 'src')
          from fastapi.testclient import TestClient
          from judge_helper.main import create_app
          app = create_app(database_url='sqlite+pysqlite:///:memory:')
          with TestClient(app) as c:
              r = c.get('/health')
              assert r.status_code == 200 and r.json() == {'status': 'ok'}, r.text
              print('Smoke OK: /health ->', r.json())
              r = c.get('/')
              assert r.status_code == 200 and 'Помощник судьи' in r.text, r.text[:200]
              print('Smoke OK: веб-интерфейс отдаётся')
          "

  # ---------------------------------------------------------------------------
  docker:
    name: Образ (сборка → скан → smoke → публикация)
    runs-on: ubuntu-latest
    needs: [lint, test, smoke]
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: Настройка Buildx
        uses: docker/setup-buildx-action@v3

      - name: Имя образа (lowercase — требование Docker)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/judge-helper" >> "$GITHUB_OUTPUT"

      - name: Метаданные образа (теги и OCI-метки)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          labels: |
            org.opencontainers.image.title=Помощник судьи
            org.opencontainers.image.description=FastAPI-приложение «Помощник судьи»

      - name: Сборка образа (локально, для проверок)
        uses: docker/build-push-action@v6
        with:
          context: app
          file: app/Dockerfile
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Определение локального тега образа
        id: ref
        run: echo "ref=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Smoke-тест контейнера (/health + веб-интерфейс)
        run: |
          set -euo pipefail
          trap 'docker rm -f judge-helper-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name judge-helper-smoke -p 18000:8000 \
            -e APP_SECRET_KEY=ci-secret \
            -e ECHO_EMAIL_TOKENS=0 \
            "${{ steps.ref.outputs.ref }}"
          ok=""
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18000/health | grep -q '"status":"ok"'; then
              ok=1; break
            fi
            sleep 2
          done
          [ -n "$ok" ] || { echo "Контейнер не поднялся"; docker logs judge-helper-smoke; exit 1; }
          curl -fsS http://127.0.0.1:18000/ | grep -q "Помощник судьи"
          echo "Smoke OK: контейнер работает"

      - name: "Сканирование образа (Trivy, severity CRITICAL/HIGH)"
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.ref.outputs.ref }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Загрузка результатов скана в Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

      - name: Вход в GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Публикация образа в GHCR
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ steps.meta.outputs.tags }}" | while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              docker push "$tag"
              echo "Pushed: $tag"
            fi
          done

      - name: Итоги
        if: always()
        run: |
          {
            echo "### Docker-образ"
            echo ""
            if [ "${{ github.event_name }}" != "pull_request" ]; then
              echo "Опубликован в GHCR:"
            else
              echo "Собран локально (PR — публикация не выполняется):"
            fi
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
